<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sketcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <span id="app-title">Sketcher</span>
      <div id="file-actions">
        <button id="btn-new" title="New canvas">New</button>
        <button id="btn-save" title="Save as PNG">Save PNG</button>
      </div>
    </header>

    <div id="toolbar">
      <div class="tool-group" id="tools">
        <button class="tool-btn active" data-tool="pencil" title="Pencil">✏️</button>
        <button class="tool-btn" data-tool="brush" title="Brush">🖌️</button>
        <button class="tool-btn" data-tool="eraser" title="Eraser">🧽</button>
        <button class="tool-btn" data-tool="fill" title="Fill bucket">🪣</button>
        <button class="tool-btn" data-tool="eyedropper" title="Color picker">💧</button>
        <button class="tool-btn" data-tool="line" title="Line">╱</button>
        <button class="tool-btn" data-tool="rect" title="Rectangle">▭</button>
        <button class="tool-btn" data-tool="rect-fill" title="Filled rectangle">▮</button>
        <button class="tool-btn" data-tool="ellipse" title="Ellipse">◯</button>
        <button class="tool-btn" data-tool="ellipse-fill" title="Filled ellipse">⬤</button>
        <button class="tool-btn" data-tool="text" title="Text">🅰️</button>
      </div>

      <div class="tool-group" id="options">
        <label class="opt">
          Size
          <input type="range" id="size" min="1" max="50" value="4">
          <span id="size-val">4</span>
        </label>
        <label class="opt" id="fontsize-opt" hidden>
          Font
          <input type="range" id="fontsize" min="8" max="96" value="24">
          <span id="fontsize-val">24</span>
        </label>
      </div>

      <div class="tool-group" id="history">
        <button id="btn-undo" title="Undo (Ctrl+Z)">↶ Undo</button>
        <button id="btn-redo" title="Redo (Ctrl+Y)">↷ Redo</button>
      </div>

      <div class="tool-group" id="canvas-size-group">
        <label class="opt">
          W <input type="number" id="canvas-w" min="10" max="4000" value="1000">
        </label>
        <label class="opt">
          H <input type="number" id="canvas-h" min="10" max="4000" value="650">
        </label>
        <button id="btn-resize" title="Resize canvas to the values above">Resize</button>
      </div>
    </div>

    <div id="colorbar">
      <div id="swatches"></div>
      <div id="active-colors">
        <label class="color-slot">
          <input type="color" id="color-primary" value="#000000">
          <span>Primary</span>
        </label>
        <label class="color-slot">
          <input type="color" id="color-secondary" value="#ffffff">
          <span>Secondary</span>
        </label>
      </div>
    </div>

    <div id="canvas-wrap">
      <canvas id="canvas" width="1000" height="650"></canvas>
      <canvas id="overlay" width="1000" height="650"></canvas>
      <div id="resize-preview"></div>
      <div class="resize-handle" id="handle-e" data-dir="e" title="Drag to resize width"></div>
      <div class="resize-handle" id="handle-s" data-dir="s" title="Drag to resize height"></div>
      <div class="resize-handle" id="handle-se" data-dir="se" title="Drag to resize"></div>
    </div>

    <footer id="statusbar">
      <span id="status-tool">Pencil</span>
      <span id="status-pos">x: 0, y: 0</span>
      <span id="status-size">1000 × 650</span>
    </footer>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
